name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 生成自托管活动图（不依赖任何第三方图床服务）。
      # 说明：README 原先引用的 github-readme-activity-graph.vercel.app 已返回 HTTP 402
      # DEPLOYMENT_DISABLED 导致活动图整块空白，因此改为在 Actions 内自行生成 SVG。
      # 输出到 dist/ 与下面的贡献蛇共用同一个 build_dir，这样一次发布即可同时更新
      # 两类产物，也避免两条工作流各自推送时互相清掉对方的文件。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate activity graph SVGs
        run: node scripts/generate-activity-graph.mjs "${{ github.repository_owner }}" dist

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0ea5e9&color_dots=#e0f2fe,#bae6fd,#7dd3fc,#38bdf8,#0ea5e9
            dist/github-snake-dark.svg?color_snake=#0ea5e9&color_dots=#0c1e3a,#1e3a8a,#1e90ff,#00bfff,#0ea5e9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
